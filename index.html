<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--tx:#222;--mu:#666;--bd:#ddd;--sf:#fff;--w:#7B1E3F;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1b1d;--tx:#f2f2f2;--mu:#aaa;--bd:#3a3a3d;--sf:#26262a}}
:root[data-theme="dark"]{--bg:#1b1b1d;--tx:#f2f2f2;--mu:#aaa;--bd:#3a3a3d;--sf:#26262a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 Inter,system-ui,sans-serif}button,input,select{font:inherit;color:inherit}button{cursor:pointer}
h1,h2,h3{font-family:'Playfair Display',Georgia,serif;font-weight:500;margin:0}h1{font-size:clamp(26px,4vw,38px)}
header{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:12px clamp(16px,4vw,32px);border-bottom:1px solid var(--bd);position:sticky;top:0;background:var(--bg);z-index:5}
.lg{display:flex;gap:10px;align-items:center;border:0;background:none;text-align:left;padding:0}.lg i{width:28px;height:28px;border-radius:50%;background:#444}.lg b{font:600 18px 'Playfair Display',serif;display:block}.lg small{font-size:9px;letter-spacing:.15em;color:var(--mu);text-transform:uppercase}
.ct{justify-self:end;background:#222;color:#fff;border:0;border-radius:99px;padding:0 16px;height:38px;display:flex;align-items:center;gap:8px;font-weight:600}
main{padding:24px clamp(16px,4vw,32px) 120px;max-width:1280px;margin:0 auto}
.bt{border:1px solid #888;background:var(--sf);border-radius:99px;min-height:44px;padding:0 22px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px}.pr{background:var(--w);color:#fff;border-color:var(--w)}.bt:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.chip{border:1px solid #888;border-radius:99px;height:36px;padding:0 16px;background:var(--sf)}.chip.on{background:var(--w);color:#fff;border-color:var(--w)}.chip:disabled{opacity:.55;border-style:dashed}
select{border:1px solid #888;border-radius:12px;height:44px;padding:0 12px;background:var(--sf);max-width:100%}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px;margin-top:20px}
.pc{background:var(--sf);border:1px solid var(--bd);border-radius:20px;padding:12px 12px 20px;box-shadow:0 12px 28px rgba(34,34,34,.16),0 2px 6px rgba(34,34,34,.08)}.pc img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:14px;display:block}.pc>*:not(img){margin-left:6px;margin-right:6px}.pc h3{font-size:20px;margin-top:12px}.pc small{color:var(--mu);display:block}.pc p{font-weight:600;font-size:18px;margin:2px 6px 10px}.pc .bt{background:var(--w);color:#fff;border-color:var(--w)}
.dt{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:14px 40px;margin-top:22px}.iw{position:relative;min-height:300px}.iw .big{position:absolute;inset:0;width:100%;height:100%}.th2{margin-top:-2px}@media(max-width:820px){.dt{grid-template-columns:1fr;gap:16px}.iw{min-height:0;aspect-ratio:1/.85}.cd{order:3}}
.big{object-fit:cover;border-radius:16px;display:block}.th{display:flex;gap:12px;margin:0 0 10px}.th button{padding:0;border:2px solid transparent;border-radius:12px;overflow:hidden;width:84px;height:84px;background:none}.th button.on{border-color:var(--w)}.th img{width:100%;height:100%;object-fit:cover;display:block}
.cd{border:1px solid #888;border-radius:20px;background:var(--sf);padding:clamp(18px,3vw,28px)}.lb{font-size:13px;color:var(--mu);margin:14px 0 6px}hr{border:0;border-top:1px solid var(--bd);margin:16px 0}
.buy{display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap;margin-top:20px}.buy .pr{flex:1;min-width:180px;min-height:52px}.pz{font-size:30px}
.qty{display:inline-flex;align-items:center;gap:14px;border:1px solid #888;border-radius:99px;height:44px;padding:0 6px;font-weight:600}.qty button{border:0;background:none;width:34px;height:34px;font-size:18px}.qty button:disabled{opacity:.35}
.tip{position:relative;cursor:help;display:inline-block}.tip span{display:none;position:absolute;left:0;top:22px;width:230px;background:#222;color:#fff;padding:8px 10px;border-radius:10px;font-size:12px;z-index:3}.tip:hover span,.tip:focus span{display:block}
.bub{align-self:flex-start;max-width:90%;background:#f0f0f0;color:#222;border:1px solid #ddd;border-radius:14px;padding:10px 14px;line-height:1.45}.me{align-self:flex-end;background:#222;color:#fff;border-color:#222}.al{margin-top:14px;max-width:none}
.ok{background:#E6F4EC;border-color:#1E7B4F;color:#14532D}.wa{background:#FFF4D6;border-color:#B7791F;color:#6B4500}.in{background:#E8F0FB;border-color:#1F5FA8;color:#173F73}.or{background:#FFEDD5;border-color:#C2570C;color:#7C2D12}.er{background:#FDECEA;border-color:#B3261E;color:#7A1A14}
code{background:#F6E9EE;color:var(--w);border-radius:6px;padding:1px 6px;font-weight:600}
.cr{display:grid;grid-template-columns:auto 2fr 1.2fr 1fr .7fr .9fr;gap:12px;align-items:center;padding:14px 8px;border-bottom:1px solid var(--bd)}.cr.hr{color:var(--mu);font-weight:600;font-size:13px}.pi{display:flex;gap:12px;align-items:center}.pi img{width:64px;height:64px;border-radius:12px;object-fit:cover}.xb{border:0;background:none;padding:8px}
.stc{display:inline-flex;gap:6px;align-items:center;border-radius:99px;padding:3px 12px;font-size:12px;font-weight:600;border:1px solid;width:fit-content}
@media(max-width:760px){.cr{grid-template-columns:auto 1fr}.cr.hr{display:none}.cr>[data-l]{grid-column:2}.cr>[data-l]::before{content:attr(data-l) ': ';color:var(--mu)}}
.ft{position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1px solid var(--bd);padding:12px clamp(16px,4vw,32px) calc(12px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;z-index:4}
.stp{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--mu)}.stp div{text-align:center}.stp span{width:32px;height:32px;border-radius:50%;border:1px solid #888;display:flex;align-items:center;justify-content:center;margin:0 auto 2px}.stp .a span{background:var(--w);color:#fff;border-color:var(--w)}
.tot{text-align:right}.tot b{font-size:30px;display:block}
.trk{display:flex;gap:4px;margin:14px 0}.tk{flex:1;text-align:center;font-size:12px;color:var(--mu);position:relative}.tk span{width:32px;height:32px;border-radius:50%;border:1.5px solid #888;display:flex;align-items:center;justify-content:center;margin:0 auto 6px;background:var(--sf);position:relative;z-index:1}.tk:not(:last-child)::after{content:"";position:absolute;top:16px;left:50%;width:100%;height:2px;background:#ccc}.tk.d::after{background:var(--w)}.tk.d span,.tk.c span{background:var(--w);color:#fff;border-color:var(--w)}.tk.c{color:var(--tx);font-weight:600}
@media(max-width:640px){.trk{flex-direction:column}.tk{display:flex;gap:10px;text-align:left;align-items:center}.tk span{margin:0;width:26px;height:26px}.tk::after{display:none}}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}#ov[hidden],#ch[hidden],#sn[hidden]{display:none}
.md{width:min(560px,100%);background:var(--sf);border-radius:24px;padding:clamp(20px,4vw,40px);display:flex;flex-direction:column;gap:16px}
#sn{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(110px + env(safe-area-inset-bottom,0px));background:#222;color:#fff;border-radius:14px;padding:10px 12px 10px 18px;display:flex;gap:16px;align-items:center;z-index:9;width:max-content;max-width:calc(100% - 24px)}#sn button{background:#fff;color:var(--w);border:0;border-radius:99px;height:36px;padding:0 16px;font-weight:600}
#fab{position:fixed;right:24px;bottom:calc(24px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:var(--w);color:#fff;border:0;display:flex;align-items:center;justify-content:center;z-index:8}body[data-v=carrito] #fab{bottom:calc(130px + env(safe-area-inset-bottom,0px))}@media(max-width:640px){body[data-v=carrito] #fab{bottom:calc(210px + env(safe-area-inset-bottom,0px))}}
#ch{position:fixed;right:24px;bottom:96px;width:390px;height:min(640px,calc(100dvh - 120px));background:var(--sf);border:1px solid #888;border-radius:20px;display:flex;flex-direction:column;overflow:hidden;z-index:12;box-shadow:0 16px 40px rgba(0,0,0,.25)}
@media(max-width:640px){#ch{inset:0;width:auto;height:auto;border-radius:0;padding-top:env(safe-area-inset-top,0px)}body.co #fab{display:none}}
.chh{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--bd);font-weight:600}.chh b{flex:1}.av{width:26px;height:26px;border-radius:50%;background:#555}.chh button{border:0;background:none;font-size:18px;padding:6px}
#cb{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px}.ops{display:flex;flex-direction:column;gap:8px;margin-top:10px}.ops button{border:1px solid #888;background:var(--sf);color:var(--tx);border-radius:12px;padding:10px 12px;text-align:left;min-height:44px;display:flex;justify-content:space-between;gap:8px}.ops button:disabled{border-style:dashed;opacity:.6}
.inp{display:flex;gap:10px;padding:12px calc(12px) calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--bd)}.inp input{flex:1;min-width:0;border:1px solid #888;border-radius:99px;height:44px;padding:0 16px;background:var(--bg)}.go{width:44px;height:44px;border-radius:50%;background:var(--w);color:#fff;border:0;font-size:18px}
.cns{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:18px 0}.cn{border:1px solid;border-radius:14px;padding:12px 14px}.cn b{font-size:26px;display:block}.cn small{font-size:12px}.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:760px}th{text-align:left;font-size:13px;color:var(--mu);padding:12px 8px;border-bottom:1px solid var(--bd)}td{padding:12px 8px;border-bottom:1px solid var(--bd)}.adm{min-height:38px;padding:0 16px;font-size:13px}@media(max-width:560px){.lg div{display:none}.adm{padding:0 10px;font-size:12px}}

let cart=[],orders=[],D={i:0,s:1,q:1,im:0},del=null,srt=1;
const trk=i=>'<div class="trk">'+ST.map((n,k)=>`<div class="tk ${k<i?'d':k==i?'c':''}"><span>${k<i?'✓':k+1}</span>${n}</div>`).join('')+'</div>';
const SC=[['#FFF4D6','#B7791F','#6B4500'],['#E8F0FB','#1F5FA8','#173F73'],['#F6E9EE','#7B1E3F','#5C1530'],['#DDF3F0','#0F766E','#0B4F4A'],['#E6E9FA','#3949AB','#26327A'],['#E6F4EC','#1E7B4F','#14532D']],SEED=[{id:'EJ-01',c:'Ana M.',it:[{i:0,s:1,q:1}],st:2},{id:'EJ-02',c:'Luis P.',it:[{i:1,s:0,q:2}],st:4}];
const chip=(t,b,c,x)=>`<span class="stc" style="background:${b};border-color:${c};color:${x}">${t}</span>`;
const V={
catalogo(){const l=[...P.keys()].sort((a,b)=>srt*(P[a].p[0]-P[b].p[0]));return `<h1>Nuestros Productos</h1><div class="row" style="margin-top:18px;justify-content:flex-end"><select data-c="srt" aria-label="Precio"><option value="1">Precio: menor a mayor</option><option value="-1" ${srt<0?'selected':''}>Precio: mayor a menor</option></select></div><div class="g3">${l.map(i=>`<div class="pc"><img src="${P[i].c}" alt="${P[i].n}"><h3>${P[i].n}</h3><small>Desde</small><p>${M(P[i].p[0])}</p><button class="bt" data-a="ver" data-v="${i}">Ver más</button></div>`).join('')}</div>`},
producto(){const p=P[D.i],u=p.p[D.s],mx=D.q>=10;return `<div class="row"><button class="bt" data-a="back">‹ Atrás</button><span class="bt">Detalles producto</span></div><div class="dt"><div class="iw"><img class="big" src="${p.g[D.im]}" alt="${p.n}"></div><div class="cd"><h1>${p.n}</h1><hr><p class="lb" style="margin-top:0">Descripción</p><p>${p.d}</p><p class="lb">Tamaños</p><select data-c="s" style="width:100%" aria-label="Tamaño">${SZ.map((s,k)=>`<option value="${k}" ${k==D.s?'selected':''}>${s} · ${M(p.p[k])}</option>`).join('')}</select><div class="buy"><div><p class="lb" style="margin:0 0 6px">Precio <span class="tip" tabindex="0">ⓘ<span>El precio varía según la cantidad y las porciones.</span></span></p><b class="pz">${M(u*D.q)}</b></div><div><p class="lb" style="margin:0 0 6px">Cantidad</p><div class="qty"><button data-a="dec" aria-label="Menos" ${D.q<2?'disabled':''}>−</button>${D.q}<button data-a="inc" aria-label="Más" ${mx?'disabled':''}>+</button></div></div></div><button class="bt pr" data-a="add" style="width:100%;margin-top:18px;min-height:52px">Agregar al carrito</button>${mx?'<div class="bub wa al">⚠ <b>Máximo disponible:</b> solo hay 10 unidades en stock.</div>':''}</div><div class="th2"><div class="th">${p.g.map((g,k)=>`<button class="${k==D.im?'on':''}" data-a="th" data-v="${k}" aria-label="Foto ${k+1}"><img src="${g}" alt=""></button>`).join('')}</div><p style="color:var(--mu);margin:0">Stock: 10 unds</p></div></div>`},
carrito(){const t=cart.reduce((s,x)=>s+x.pz,0);return `<div class="row"><button class="bt" data-a="back">‹ Atrás</button><span class="bt">Carrito compras</span></div><div style="margin-top:20px"><div class="cr hr"><span style="width:36px"></span><span>Producto</span><span>Estado</span><span>Método envío</span><span>Unidades</span><span>Precio</span></div>${cart.length?cart.map((x,k)=>`<div class="cr"><button class="xb" data-a="del" data-v="${k}" aria-label="Eliminar producto">🗑</button><div class="pi"><img src="${P[x.i].c}" alt=""><div><b>${P[x.i].n}</b><br><small style="color:var(--mu)">Tamaño seleccionado: ${SZ[x.s]}</small></div></div><div data-l="Estado">${chip('⏱ En confirmación','#FFEDD5','#C2570C','#7C2D12')}</div><div data-l="Método envío">Domicilio</div><div data-l="Unidades">${x.q} und</div><b data-l="Precio">${M(x.pz)}</b></div>`).join(''):'<p style="text-align:center;color:var(--mu);padding:48px 0">Tu carrito está vacío</p>'}</div><div class="ft"><div class="stp"><div class="a"><span>1</span>Confirmación compra</div>→<div><span>2</span>Detalles envío</div>→<div><span>3</span>Confirmación pago</div></div><div class="row"><div class="tot"><small style="color:var(--mu)">Total a pagar</small><b>${M(t)}</b></div><button class="bt pr" data-a="conf" ${cart.length?'':'disabled'}>Confirmar pedido</button></div></div>`},
pedido(){const o=orders[orders.length-1];if(!o)return V.catalogo();return `<div style="max-width:900px;margin:0 auto;text-align:center"><div style="color:#1E7B4F;font-size:56px">✔</div><h1>¡Pedido confirmado!</h1><p style="color:var(--mu)">Pedido N.º ${o.id} · Te avisaremos cada vez que cambie su estado.</p><div class="cd" style="text-align:left;margin:20px 0">${o.it.map(x=>`<div class="row sp"><div class="pi"><img src="${P[x.i].c}" alt=""><div><b>${P[x.i].n}</b><br><small style="color:var(--mu)">${SZ[x.s]} · ${x.q} und · Domicilio</small></div></div><b>${M(x.pz)}</b></div>`).join('<hr>')}<hr><div class="row sp"><b>Total</b><b>${M(o.t)}</b></div></div><div class="cd" style="text-align:left"><p class="lb" style="margin-top:0">Estado del pedido</p>${trk(o.st)}</div><div class="row" style="justify-content:center;margin-top:24px"><button class="bt pr" data-a="chat" data-v="consultar pedidos">Consultar pedido</button><button class="bt" data-a="go" data-v="catalogo">Seguir comprando</button></div></div>`},
panel(){const all=[...SEED,...orders];return `<h1>Pedidos</h1><div class="bub in al" style="max-width:none">🔒 Esta pantalla solo es visible para los administradores, no para los usuarios.</div><div class="cns">${ST.map((n,k)=>`<div class="cn" style="background:${SC[k][0]};border-color:${SC[k][1]};color:${SC[k][2]}"><b>${all.filter(o=>o.st==k).length}</b><small>${n}</small></div>`).join('')}</div><div class="tw"><table><tr><th>Pedido</th><th>Cliente</th><th>Producto</th><th>Tamaño</th><th>Entrega</th><th>Estado</th><th>Cambiar estado</th></tr>${all.map(o=>`<tr><td><b>${o.id}</b></td><td>${o.c}</td><td>${o.it.map(x=>P[x.i].n+' ×'+x.q).join(', ')}</td><td>${o.it.map(x=>SZ[x.s].split(' ')[0]).join(', ')}</td><td>Domicilio</td><td>${chip(ST[o.st],...SC[o.st])}</td><td><select data-c="st" data-id="${o.id}" aria-label="Cambiar estado">${ST.map((n,k)=>`<option value="${k}" ${k==o.st?'selected':''}>${n}</option>`).join('')}</select></td></tr>`).join('')}</table></div>`}};
function draw(){const h=location.hash.slice(1)||'catalogo',[v,a]=h.split('-');const k=V[v]?v:'catalogo';if(k=='producto'&&a!=null&&D.i!=+a)D={i:+a||0,s:1,q:1,im:0};document.body.dataset.v=k;$('#app').innerHTML=V[k]();$('#cc').textContent=cart.reduce((s,x)=>s+x.q,0)}
window.onhashchange=()=>{draw();scrollTo(0,0)};const nav=h=>location.hash=h;
let C={o:0,m:'',pm:'',p:null,d:null,init:0},H=[],hp=-1;
const N=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''),op=a=>'<div class="ops">'+a.map(x=>`<button data-a="s" data-v="${x[0]}" ${x[2]?'disabled':''}>${x[1]||x[0]}${x[2]||''}</button>`).join('')+'</div>';
const say=(t,k)=>{$('#cb').insertAdjacentHTML('beforeend',`<div class="bub ${k||''}">${t}</div>`);$('#cb').scrollTop=1e5},
MENU=()=>op([['realizar pedido','Realizar un pedido'],['consultar pedidos','Consultar pedidos'],['ayuda','Ayuda'],['preguntas frecuentes','Preguntas frecuentes'],['asesor','Hablar con un asesor']]),
HELP=[['Seguimiento de mi pedido','Escribe «consultar pedidos» para ver en qué estado va.'],['Cambiar o cancelar un pedido','Escríbenos con «asesor» para cambiar o cancelar un pedido.'],['Métodos de envío','Por ahora el envío es a domicilio.']],
FAQ=[['¿Cuánto tarda la entrega?','Te confirmamos el tiempo al confirmar tu pedido.'],['¿Cómo funcionan los tamaños?','Pequeña 1-3, Mediana 4-8 y Grande 9-14 porciones.'],['¿Puedo personalizar mi pedido?','Habla con un asesor para acordar detalles.'],['¿Qué métodos de pago hay?','El medio de pago se confirma en el paso 3 del carrito.']],
S={menu(){C.m='menu';say('¿En qué te puedo ayudar?'+MENU())},
order(){C.o=1;C.m='type';say('Selecciona el tipo de producto:'+op([['pasteles','Pasteles'],['tortas','Tortas'],['otros','Otros productos','<span class="stc" style="background:#FFF4D6;border-color:#B7791F;color:#6B4500">Próximamente</span>']]))},
prod(){C.m='prod';say('Selecciona el producto que deseas añadir al carrito:'+op(P.map((p,i)=>[p.n,p.n+'<b>'+M(p.p[0])+'</b>'])))},
size(i){C.d={i};C.m='size';const p=P[i];say(`Producto seleccionado: <b>${p.n}</b><br>Estos son los tamaños disponibles:<br>`+SZ.map((z,k)=>`${k+1}. ${z} · ${M(p.p[k])}`).join('<br>')+'<br>Escribe el tamaño que deseas: <code>pequeño</code>, <code>mediano</code> o <code>grande</code>.')},
consult(){C.m='menu';const o=orders[orders.length-1];say(o?`Este es tu pedido ${o.id}:<br><b>${o.it.map(x=>P[x.i].n+' · '+SZ[x.s]+' · '+x.q+' und').join('<br>')}</b><br>Total ${M(o.t)}<div style="margin:8px 0">${chip(ST[o.st],'#F6E9EE','#7B1E3F','#5C1530')}</div>`+ST.map((n,k)=>`<div style="${k==o.st?'font-weight:600':'opacity:.6'}">${k<=o.st?'●':'○'} ${n}</div>`).join(''):'Aún no tienes pedidos confirmados.','in')},
help(){C.m='help';say('¿En qué necesitas ayuda? Elige un tema:'+op(HELP.map(x=>[x[0]])))},
faq(){C.m='faq';say('Estas son las preguntas más comunes. Selecciona una para ver la respuesta:'+op(FAQ.map(x=>[x[0]])))},
adv(){C.m='menu';say('Te estamos conectando con un asesor.','in');setTimeout(()=>say('Un asesor te atenderá en este mismo chat.','in'),1200)},
salir(){A.min()}};
function go(n,a,keep){if(C.o&&!['order','prod','size'].includes(n)){C.pm=C.m;C.m='guard';C.p=()=>go(n,a,keep);return say('Estás realizando un pedido. ¿Quieres cancelarlo o seguir con él?'+op([['cancelar','Cancelar pedido'],['seguir','Seguir pedido']]),'wa')}
 if(n=='menu'||n=='consult'||n=='help'||n=='faq'||n=='adv')C.d=null;if(!keep){H=H.slice(0,hp+1);H.push([n,a]);hp=H.length-1}S[n](a)}
function rst(){A.min();$('#cb').innerHTML='';C={o:0,m:'',pm:'',p:null,d:null,init:0};H=[];hp=-1}
function send(t){t=t.trim();if(!t)return;say(t,'me');const l=N(t),m=C.m;
 if(m=='exit'){if(/^si/.test(l))return rst();if(/^no/.test(l)){C.m=C.pm;return say('Seguimos en el chat.')}return say('Escribe «sí» para salir o «no» para continuar.','wa')}
 if(m=='guard'){if(/cancel/.test(l)){C.o=0;C.d=null;say('Pedido cancelado.','ok');return C.p()}if(/segu|contin/.test(l)){C.m=C.pm;return say('Seguimos con tu pedido.')}return say('¿Quieres «cancelar» el pedido o «seguir» con él?','wa')}
 if(l=='atras'){return hp>0?(hp--,go(H[hp][0],H[hp][1],1)):say('No hay un paso anterior.','wa')}
 if(l=='adelante'){return hp<H.length-1?(hp++,go(H[hp][0],H[hp][1],1)):say('No hay un paso siguiente.','wa')}
 if(l=='menu')return go('menu');if(l=='salir'){C.pm=C.m;C.m='exit';return say('¿Deseas salir del chat? Si confirmas, <b>se borrará toda la conversación</b>'+(C.o?' y se cancelará el pedido en curso':'')+'. Escribe <code>sí</code> para salir o <code>no</code> para continuar.'+op([['si','Sí, salir'],['no','No, continuar']]),'wa')}
 if(/^pedidos?$/.test(l))return say('Reconocí la palabra «pedido». ¿Qué quieres hacer?'+op([['realizar pedido','Realizar un pedido'],['consultar pedidos','Consultar pedidos']]),'in');
 const T=[[/asesor|humano|agente/,'adv'],[/pregunt|frecuent/,'faq'],[/consult|segui|estado/,'consult'],[/ayuda/,'help'],[/realiz|hacer|pedir|nuevo/,'order']].find(x=>x[0].test(l));
 if(T)return go(T[1]);
 if(m=='type'){if(/pastel|torta/.test(l))return go('prod');if(/otro/.test(l))return say('Esa categoría estará disponible próximamente.','wa')}
 if(m=='prod'){const i=P.findIndex((p,k)=>N(p.n)==l)>=0?P.findIndex(p=>N(p.n)==l):/choc|1/.test(l)?0:/vain|2/.test(l)?1:/tres|leche|3/.test(l)?2:-1;if(i>=0)return go('size',i)}
 const d=C.d,av=d?10-cart.filter(x=>x.i==d.i).reduce((s,x)=>s+x.q,0):0;
 if(m=='size'){const k=/peque|^1$/.test(l)?0:/median|^2$/.test(l)?1:/grand|^3$/.test(l)?2:-1;if(k<0)return say('No reconocí el tamaño. Escribe <code>pequeño</code>, <code>mediano</code> o <code>grande</code>.','wa');d.s=k;say('Elegiste: '+SZ[k],'ok');if(av<1){say('Ya no hay stock disponible de este producto.','wa');return go('prod')}C.m='qty';return say(`¿Cuántas unidades deseas? Hay ${av} disponibles en stock. Escribe la cantidad.`)}
 if(m=='qty'){const q=l.match(/\d+/);if(!q)return say('Escribe la cantidad con un número.','wa');const n=+q[0];if(n<1)return say('La cantidad mínima es 1.','wa');if(n>av)return say(`Máximo disponible: ${av} unidades. ¿Cuántas deseas?`,'wa');d.q=n;say('Cantidad: '+n+' und','ok');C.m='conf';return say(`Total ${M(P[d.i].p[d.s]*n)}. Escribe <code>confirmar</code> para agregar al carrito.`)}
 if(m=='conf'){if(!/confirm/.test(l))return say('Escribe <code>confirmar</code> para agregar al carrito o <code>atrás</code> para volver.','wa');cart.push({i:d.i,s:d.s,q:d.q,pz:P[d.i].p[d.s]*d.q});C.o=0;draw();say(`Producto agregado al carrito: ${P[d.i].n} · ${SZ[d.s]} · ${d.q} und`,'ok');C.m='more';return say('¿Deseas agregar otro producto?'+op([['si','Sí'],['no','No']]))}
 if(m=='more'||m=='cont'){const s=/^si/.test(l),n=/^no/.test(l);if(m=='more'&&s)return go('order');if(m=='more'&&n){C.m='cont';return say('¿Deseas seguir comprando?'+op([['si','Sí'],['no','No']]))}if(m=='cont'&&s){A.min();return nav('catalogo')}if(m=='cont'&&n){A.min();return nav('carrito')}}
 if(m=='help'||m=='faq'){const a=(m=='help'?HELP:FAQ).find(x=>l.length>2&&(N(x[0]).includes(l)||l.includes(N(x[0]))));if(a)return say(a[1])}
 say('No logré entender tu mensaje. Elige una opción del menú:'+MENU(),'wa')}
const A={go:v=>nav(v),back:()=>history.length>1?history.back():nav('catalogo'),ver:v=>{D={i:+v,s:1,q:1,im:0};nav('producto-'+v)},th:v=>{D.im=+v;draw()},inc:()=>{D.q=Math.min(10,D.q+1);draw()},dec:()=>{D.q=Math.max(1,D.q-1);draw()},
add:()=>{cart.push({i:D.i,s:D.s,q:D.q,pz:P[D.i].p[D.s]*D.q});draw();$('#ov').hidden=false},mo:v=>{$('#ov').hidden=true;if(v)nav(v)},
del:v=>{del=[+v,cart.splice(+v,1)[0]];draw();$('#sn').hidden=false;clearTimeout(A.t);A.t=setTimeout(()=>$('#sn').hidden=true,6000)},undo:()=>{cart.splice(del[0],0,del[1]);$('#sn').hidden=true;draw()},
conf:()=>{const t=cart.reduce((s,x)=>s+x.pz,0);orders.push({c:'Cliente web',id:'DA-'+String(orders.length+1).padStart(4,'0'),it:cart,t,st:0});cart=[];nav('pedido');draw()},
chat:v=>{$('#ch').hidden=false;document.body.classList.add('co');if(!C.init){C.init=1;say('Hola, puedes gestionar tus pedidos y buscar ayuda por medio de este chat.');say('Comandos del chat: <code>atrás</code> para retroceder, <code>adelante</code> para avanzar, <code>menú</code> para ir al menú y <code>salir</code> para salir del chat (se borra la conversación). También puedes escribir una opción: <code>realizar pedido</code>, <code>consultar pedidos</code>, <code>ayuda</code>, <code>preguntas frecuentes</code> o <code>asesor</code>.','in');go('menu')}if(typeof v=='string')send(v);$('#ci').focus()},
s:v=>send(v),min:()=>{$('#ch').hidden=true;document.body.classList.remove('co')}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)A[b.dataset.a](b.dataset.v)});
document.addEventListener('change',e=>{const c=e.target.dataset.c;if(c=='srt')srt=+e.target.value;if(c=='s')D.s=+e.target.value;if(c=='st')[...SEED,...orders].find(x=>x.id==e.target.dataset.id).st=+e.target.value;draw()});
$('#cf').onsubmit=e=>{e.preventDefault();send($('#ci').value);$('#ci').value=''};
draw();
</script></body></html>
